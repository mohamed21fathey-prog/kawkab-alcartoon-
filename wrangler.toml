name = "kawkab-alcartoon-api"
main = "backend/worker.js"
compatibility_date = "2026-11-28"
workers_dev = true

# Configure this only after the owner creates a free-tier D1 database.
# Replace the placeholder with the actual database ID from the Cloudflare dashboard.
[[d1_databases]]
binding = "DB"
database_name = "kawkab-alcartoon-db"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"

[vars]
# Replace with the exact production site origin before deployment.
ALLOWED_ORIGIN = "https://kawkab-alcartoon.vercel.app"
