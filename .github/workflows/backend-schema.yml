name: Backend schema validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/kawkab-frontend-safe]

permissions:
  contents: read

jobs:
  validate-d1-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate SQLite schema and starter data
        run: python backend/validate_schema.py
